name: Staging deployment

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Bootstrap an image or deploy an existing staging service"
        required: true
        type: choice
        options:
          - bootstrap
          - deploy

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  staging:
    runs-on: ubuntu-latest
    env:
      CLUSTER: healthz-staging
      SERVICE: healthz-staging
      REPOSITORY: healthz-staging
      APP_URL: https://staging.anusha-devops.com
      MODE: ${{ inputs.mode }}
    steps:
      - name: Validate staging settings
        id: settings
        env:
          ROLE_ARN: ${{ vars.STAGING_ROLE_ARN }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Run this workflow from main."
            exit 1
          fi
          if [[ "$MODE" != "bootstrap" && "$MODE" != "deploy" ]]; then
            echo "::error::Select bootstrap or deploy."
            exit 1
          fi
          if [[ ! "$ROLE_ARN" =~ ^arn:aws:iam::([0-9]{12}):role/healthz-staging-github-actions$ ]]; then
            echo "::error::STAGING_ROLE_ARN must identify the staging role."
            exit 1
          fi
          echo "account=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "version=staging-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - name: Configure staging AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.STAGING_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: Verify staging identity
        env:
          ACCOUNT: ${{ steps.settings.outputs.account }}
        run: |
          identity=$(aws sts get-caller-identity --output json)
          if ! jq -e --arg account "$ACCOUNT" \
            '.Account == $account and (.Arn | test("^arn:aws:sts::[0-9]{12}:assumed-role/healthz-staging-github-actions/"))' <<< "$identity" > /dev/null; then
            echo "::error::AWS credentials do not belong to the staging role."
            exit 1
          fi

      - name: Check staging service
        id: service
        run: |
          result=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" --output json)
          if jq -e '(.services | length) == 0 and (.failures | length) == 1 and .failures[0].reason == "MISSING"' <<< "$result" > /dev/null; then
            if [[ "$MODE" != "bootstrap" ]]; then
              echo "::error::Create the staging service before deploying."
              exit 1
            fi
          else
            arn=$(jq -er 'if (.failures | length) == 0 and (.services | length) == 1 and .services[0].status == "ACTIVE" then .services[0].taskDefinition else error("Staging service lookup failed") end' <<< "$result")
            if [[ "$MODE" != "deploy" || "$arn" != arn:* ]]; then
              echo "::error::Bootstrap requires a missing service; deploy requires its task definition."
              exit 1
            fi
            echo "arn=$arn" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to staging ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image reference
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          VERSION: ${{ steps.settings.outputs.version }}
        run: echo "ref=$REGISTRY/$REPOSITORY:$VERSION" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build staging image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.image.outputs.ref }}
          build-args: APP_VERSION=${{ steps.settings.outputs.version }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.settings.outputs.version }}

      - name: Scan staging image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Push staging image
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: docker push "$IMAGE"

      - name: Report bootstrap image
        if: inputs.mode == 'bootstrap'
        env:
          VERSION: ${{ steps.settings.outputs.version }}
        run: |
          echo "Staging image tag: $VERSION"
          echo "Staging image tag: \`$VERSION\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Set this as the staging Pulumi imageTag before creating the service." >> "$GITHUB_STEP_SUMMARY"

      - name: Fetch staging task definition
        if: inputs.mode == 'deploy'
        env:
          TASK_DEFINITION: ${{ steps.service.outputs.arn }}
        run: |
          aws ecs describe-task-definition --task-definition "$TASK_DEFINITION" \
            --query taskDefinition > task-definition.json

      - name: Identify previous staging version
        if: inputs.mode == 'deploy'
        id: previous_version
        run: |
          image=$(jq -er '[.containerDefinitions[] | select(.name == "app") | .image] | if length == 1 and (.[0] | type == "string") then .[0] else error("Expected one app image") end' task-definition.json)
          version=$(jq -r '[.containerDefinitions[] | select(.name == "app") | .environment[]? | select(.name == "APP_VERSION") | .value] | first // ""' task-definition.json)
          if [[ -z "$version" ]]; then version="${image##*:}"; fi
          if [[ ! "$version" =~ ^staging-[0-9]+-[0-9]+$ ]]; then
            echo "::error::The previous staging version could not be determined."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Render staging task definition
        if: inputs.mode == 'deploy'
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: app
          image: ${{ steps.image.outputs.ref }}
          environment-variables: |
            APP_VERSION=${{ steps.settings.outputs.version }}
            PREVIOUS_APP_VERSION=${{ steps.previous_version.outputs.version }}

      - name: Deploy staging service
        if: inputs.mode == 'deploy'
        id: deploy
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: healthz-staging
          service: healthz-staging
          wait-for-service-stability: true
          wait-for-minutes: 10

      - name: Verify staging health
        if: inputs.mode == 'deploy'
        id: smoke
        env:
          VERSION: ${{ steps.settings.outputs.version }}
          PREVIOUS: ${{ steps.previous_version.outputs.version }}
        run: |
          for i in $(seq 1 20); do
            body=$(curl -fsS --max-time 10 "$APP_URL/healthz" || true)
            echo "attempt $i: $body"
            if echo "$body" | jq -e --arg version "$VERSION" --arg previous "$PREVIOUS" \
              '.status == "ok" and .version == $version and .previous_version == $previous' > /dev/null; then
              echo "Staging deployment verified"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Staging deployment did not report the expected versions."
          exit 1

      - name: Roll back staging service
        if: failure() && steps.service.outputs.arn != '' && (steps.deploy.outcome == 'failure' || (steps.deploy.outcome == 'success' && steps.smoke.outcome == 'failure'))
        env:
          TASK_DEFINITION: ${{ steps.service.outputs.arn }}
        run: |
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" \
            --task-definition "$TASK_DEFINITION" > /dev/null
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"
          echo "Rolled staging back to $TASK_DEFINITION"
