name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: healthz-app
  IMAGE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}

jobs:
  test:
    name: Unit tests & code scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements-dev.txt

      - name: Unit tests
        run: pytest -q

      - name: SAST (bandit)
        run: bandit -r app

      - name: Dependency vulnerabilities (pip-audit)
        run: pip-audit -r requirements.txt

      - name: IaC and secret scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: misconfig,secret
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

  build:
    name: Build & scan image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate release version
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: |
          if [[ ! "$IMAGE_VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || (( ${#IMAGE_VERSION} > 128 )); then
            echo "::error::Release tags must use the format vMAJOR.MINOR.PATCH."
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Build image (local)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: APP_VERSION=${{ env.IMAGE_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container image scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Record release version
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: printf '%s\n' "$IMAGE_VERSION" > release-version.txt

      - name: Upload release version
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: release-version-${{ github.run_attempt }}
          path: release-version.txt
          if-no-files-found: error
